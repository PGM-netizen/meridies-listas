name: actualizar-listas
on:
  schedule:
    - cron: "10 4 * * 1-5"     # cada día laborable, antes de la tarea diaria de Meridies
  workflow_dispatch: {}
  push:
    branches: [main]
permissions:
  contents: write
concurrency: { group: listas, cancel-in-progress: false }
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - name: Tests
        run: node --test test/*.test.mjs
      - name: Datos anteriores (rama data)
        run: |
          git fetch --depth 1 origin data && git worktree add prev-wt origin/data && mkdir -p prev && cp prev-wt/data/*.json prev/ || echo "primera ejecución"
      - name: Descargar y procesar listas oficiales
        run: node build.mjs
      - name: Publicar en la rama data
        run: |
          rm -rf out && mkdir -p out/lib && cp -r data out/ && cp screen.mjs out/ && cp lib/match.mjs out/lib/ && cp README.md out/
          cd out && git init -q -b data && git add -A
          git -c user.name="meridies-bot" -c user.email="actions@users.noreply.github.com" commit -qm "Listas $(date -u +%F)"
          git push -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}" data
